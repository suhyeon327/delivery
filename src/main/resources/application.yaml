spring:
  application:
    name: delivery

  datasource:
    url: jdbc:postgresql://localhost:5433/delivery
    username: delivery
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
